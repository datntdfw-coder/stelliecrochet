<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellie Crochet</title>
<meta name="description" content="Stellie Crochet - đồ móc len handmade. Sắp ra mắt!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧶</text></svg>">
<style>
  :root { --bg:#fff6f3; --ink:#5a3e4b; --accent:#e88fa8; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family: "Segoe UI", system-ui, -apple-system, sans-serif; text-align:center; padding:16px; }
  .yarn { font-size:72px; animation: bob 3s ease-in-out infinite; }
  h1 { font-size:clamp(32px,8vw,56px); margin:12px 0 8px; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  p { font-size:18px; opacity:.8; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-8deg); } }
</style>
</head>
<body>
  <main>
    <div class="yarn">🧶</div>
    <h1>Hello World from <span>Stellie Crochet</span></h1>
    <p>Đồ móc len handmade · Sắp ra mắt 💕</p>
  </main>
</body>
</html>
