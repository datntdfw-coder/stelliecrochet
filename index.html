<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellie Crochet · Coming soon</title>
<meta name="description" content="Stellie Crochet - handmade crochet. Coming soon!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23f7c3d0' stroke='%23e07a98' stroke-width='5'/><path d='M14 40 Q50 20 86 44 M10 58 Q52 36 90 62 M26 84 Q40 40 76 16 M40 92 Q54 54 90 34' fill='none' stroke='%23e07a98' stroke-width='4'/></svg>">
<style>
  :root { --bg:#fff6f3; --ink:#5a3e4b; --accent:#e07a98; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family: "Segoe UI", system-ui, -apple-system, sans-serif; text-align:center; padding:16px; }
  .yarn { width:min(220px,55vw); height:auto; animation: bob 3.2s ease-in-out infinite; overflow:visible; }
  h1 { font-size:clamp(34px,9vw,60px); margin:18px 0 6px; letter-spacing:.5px; color:var(--accent); }
  p { font-size:clamp(18px,4.5vw,24px); letter-spacing:3px; text-transform:uppercase; opacity:.75; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-6deg); } }
</style>
</head>
<body>
  <main>
    <svg class="yarn" viewBox="0 0 240 200" role="img" aria-label="Pink ball of yarn">
      <defs>
        <clipPath id="ball"><circle cx="100" cy="100" r="80"/></clipPath>
        <radialGradient id="shade" cx="38%" cy="32%" r="75%">
          <stop offset="0" stop-color="#fde3ea"/><stop offset=".65" stop-color="#f7bfce"/><stop offset="1" stop-color="#ee9fb5"/>
        </radialGradient>
      </defs>
      <path d="M168 138 C190 150 205 170 238 160" fill="none" stroke="#e07a98" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="80" fill="url(#shade)"/>
      <g clip-path="url(#ball)" fill="none" stroke="#e07a98" stroke-width="3" stroke-linecap="round" opacity=".9">
        <path d="M20 70 Q100 30 180 80"/><path d="M18 88 Q100 46 182 98"/><path d="M22 106 Q100 64 184 116"/>
        <path d="M60 190 Q70 100 140 24"/><path d="M78 196 Q90 110 160 36"/><path d="M96 200 Q110 120 178 54"/>
        <path d="M30 150 Q90 120 160 168"/><path d="M40 168 Q100 140 150 182"/>
      </g>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#e07a98" stroke-width="4"/>
    </svg>
    <h1>Stellie Crochet</h1>
    <p>Coming soon</p>
  </main>
</body>
</html>
